<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 圆形背景:深咖啡色,呼应网站羊皮纸风格 -->
  <rect width="64" height="64" rx="14" fill="#2D2A26"/>
  <!-- 内圈装饰:细线圆环,象征全球/外贸 -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#7BA369" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.55"/>
  <!-- 字母 K:品牌主标 -->
  <path d="M22 18 L22 46 M22 32 L40 18 M22 32 L40 46" fill="none" stroke="#FAF7F2" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 右下角小绿点:呼应侧边栏 System Online 指示灯 -->
  <circle cx="46" cy="46" r="3" fill="#7BA369"/>
</svg>
