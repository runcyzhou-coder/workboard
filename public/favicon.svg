<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- White background -->
  <rect width="64" height="64" rx="12" fill="#FFFFFF"/>
  
  <!-- Globe: green circle with grid lines -->
  <circle cx="34" cy="38" r="18" fill="#A8D5A2"/>
  <!-- Globe grid - horizontal lines -->
  <ellipse cx="34" cy="38" rx="18" ry="6" fill="none" stroke="#4A8B3E" stroke-width="1.2"/>
  <ellipse cx="34" cy="38" rx="18" ry="12" fill="none" stroke="#4A8B3E" stroke-width="1"/>
  <!-- Globe grid - vertical lines -->
  <ellipse cx="34" cy="38" rx="6" ry="18" fill="none" stroke="#4A8B3E" stroke-width="1"/>
  <ellipse cx="34" cy="38" rx="12" ry="18" fill="none" stroke="#4A8B3E" stroke-width="1"/>
  <!-- Center vertical line -->
  <line x1="34" y1="20" x2="34" y2="56" stroke="#4A8B3E" stroke-width="1"/>
  <!-- Center horizontal line -->
  <line x1="16" y1="38" x2="52" y2="38" stroke="#4A8B3E" stroke-width="1"/>
  
  <!-- Upward arrow (dark green) -->
  <path d="M 20 48 L 20 32 L 30 22 L 36 22 L 26 32 L 40 32 L 40 48 Z" fill="#1F6B3A" stroke="#1F6B3A" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- Arrow head -->
  <path d="M 36 14 L 52 24 L 40 28 L 38 34 L 30 34 L 32 28 L 26 24 Z" fill="#1F6B3A" stroke="#1F6B3A" stroke-width="0.5" stroke-linejoin="round"/>
  
  <!-- Chat bubbles (light green, left side) -->
  <rect x="6" y="26" width="14" height="10" rx="3" fill="#7BC67E"/>
  <polygon points="10,36 12,40 14,36" fill="#7BC67E"/>
  <rect x="10" y="18" width="12" height="8" rx="3" fill="#5BB85F"/>
  <polygon points="14,26 15,29 16,26" fill="#5BB85F"/>
</svg>